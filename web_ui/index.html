<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="J.A.R.V.I.S. is a highly responsive, multi-agent AI assistant capable of voice control, gesture recognition, web navigation, and OS hardware control.">
    <meta name="keywords" content="Jarvis, AI, Voice Control, Gesture Recognition, Multi-Agent, Smart Assistant">
    <title>Jarvis Interface</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Top Header -->
        <header>
            <h1>J.A.R.V.I.S.</h1>
            <div style="display:flex; align-items:center; gap: 20px;">
                <button id="enable-audio-btn" style="background: #00e5ff; color: #000; border: none; padding: 8px 16px; border-radius: 4px; font-family: 'Orbitron', sans-serif; cursor: pointer; font-weight: bold; transition: all 0.2s ease;">ENABLE AUDIO</button>
                <div class="status-indicator" id="system-status">
                    <span class="dot disconnected"></span>
                    <span id="status-text">Disconnected</span>
                </div>
            </div>
        </header>

        <!-- Main Interface -->
        <main>
            <!-- Glowing Orb / Voice Visualizer -->
            <div class="orb-container">
                <div class="orb" id="jarvis-orb"></div>
                <div class="rings">
                    <div class="ring ring-1"></div>
                    <div class="ring ring-2"></div>
                    <div class="ring ring-3"></div>
                </div>
            </div>

            <!-- Voice Transcription -->
            <div class="transcription-box">
                <h2>Voice Input</h2>
                <p id="voice-text">Waiting for voice command...</p>
            </div>

            <!-- Action Log -->
            <div class="action-log-box">
                <h2>System Log</h2>
                <ul id="action-log">
                    <li>System initialized.</li>
                </ul>
            </div>
            <!-- Command Input Box -->
            <div class="command-box">
                <input type="text" id="command-input" placeholder="Type a command to Jarvis..." autocomplete="off">
                <button id="send-btn">SEND</button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
